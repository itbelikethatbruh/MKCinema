<!-- 2.27.0 add-ons on your TV -->
<div class="sheet ads" id="ads" role="dialog" aria-label="Add-ons on your TV">
  <div class="grab"></div>
  <h3>Add-ons on your TV</h3>
  <div class="field">
    <input id="adIn" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Paste an add-on link">
    <button class="iconbtn" type="button" id="adPaste" aria-label="Paste"><svg class="i"><use href="#i-clip"/></svg></button>
  </div>
  <div class="acts"><button class="btn btn-prime" type="button" id="adAdd" disabled><svg class="i"><use href="#i-plus"/></svg>Add to your TV</button></div>
  <p class="kbnote" id="adNote">Links start with stremio:// or end in manifest.json. Changes show on the TV straight away.</p>
  <div class="ad-list" id="adList"></div>
</div>
