<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Log viewer · MKCinema</title>
<link rel="icon" href="icon-192.png">
<style>/*BASE*/
.row{display:flex;gap:8px;align-items:center;margin:10px 0}.row input{flex:1;text-transform:uppercase;letter-spacing:.2em;font-weight:600}
.list{display:grid;gap:6px;margin:14px 0}.list button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:500}
.list small{color:var(--mute)}.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:4px 12px;font-size:14px;margin:10px 0}.kv span{color:var(--mute)}
.err{color:var(--bad)}[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<a class="brand" href="./">MK<em>CINEMA</em></a>
<h1>Log viewer</h1>
<p class="sub">Only the owner's account can read logs. Everyone else sees nothing here.</p>

<div id="signin" class="card" hidden>
  <p style="margin-top:0">Sign in with your MKCinema account.</p>
  <div class="row"><input id="em" type="email" autocomplete="username" placeholder="Email" style="text-transform:none;letter-spacing:0;font-weight:400"></div>
  <div class="row"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" style="text-transform:none;letter-spacing:0;font-weight:400"><button id="go" type="button">Sign in</button></div>
  <p id="sErr" class="err"></p>
</div>

<div id="app" hidden>
  <div class="row"><input id="code" maxlength="6" placeholder="Log code" autocomplete="off"><button id="open" type="button">Open</button></div>
  <p id="msg" class="sub"></p>
  <div id="one"></div>
  <h2>Latest logs</h2>
  <div class="list" id="list"></div>
  <button id="out" type="button" class="ghost">Sign out</button>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
'use strict';
const sb = supabase.createClient('https://wogffhgdixgrayowewnf.supabase.co', '%KEY%', { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'mkc:auth' } });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function show() {
  const { data } = await sb.auth.getSession(); const on = !!(data && data.session);
  $('#signin').hidden = on; $('#app').hidden = !on; if (on) latest();
}
async function latest() {
  const { data, error } = await sb.from('mkcinema_logs').select('code, created_at, app_version, platform').order('created_at', { ascending: false }).limit(30);
  if (error) { $('#msg').textContent = error.message; return; }
  if (!data.length) { $('#msg').textContent = 'No logs, or this account is not the owner.'; $('#list').innerHTML = ''; return; }
  $('#msg').textContent = '';
  $('#list').innerHTML = data.map((r) => `<button type="button" data-c="${esc(r.code)}"><b>${esc(r.code)}</b><small>${esc(r.app_version || '')} · ${esc(r.platform || '')} · ${esc(new Date(r.created_at).toLocaleString())}</small></button>`).join('');
  document.querySelectorAll('[data-c]').forEach((b) => (b.onclick = () => { $('#code').value = b.dataset.c; openCode(); }));
}
async function openCode() {
  const code = $('#code').value.trim().toUpperCase(); if (!/^[A-Z0-9]{6}$/.test(code)) { $('#msg').textContent = 'A code has 6 letters or digits.'; return; }
  const { data, error } = await sb.from('mkcinema_logs').select('*').eq('code', code).maybeSingle();
  if (error) { $('#msg').textContent = error.message; return; }
  if (!data) { $('#msg').textContent = 'No log with that code.'; $('#one').innerHTML = ''; return; }
  $('#msg').textContent = ''; const p = data.payload || {};
  const kv = [['Code', data.code], ['Sent', new Date(data.created_at).toLocaleString()], ['Version', data.app_version], ['Platform', data.platform], ['Note', p.note || '']].filter((x) => x[1]);
  $('#one').innerHTML = `<div class="card"><div class="kv">${kv.map(([k, v]) => `<span>${esc(k)}</span><b>${esc(v)}</b>`).join('')}</div>
    <div class="row"><button type="button" id="copy" class="ghost">Copy JSON</button><button type="button" id="del" class="ghost">Delete log</button></div>
    <pre>${esc(JSON.stringify(p, null, 2))}</pre></div>`;
  $('#copy').onclick = () => navigator.clipboard.writeText(JSON.stringify(data, null, 2));
  $('#del').onclick = async () => { if (!confirm(`Delete log ${code}?`)) return; const { error: e } = await sb.from('mkcinema_logs').delete().eq('code', code); $('#msg').textContent = e ? e.message : `${code} deleted.`; if (!e) { $('#one').innerHTML = ''; latest(); } };
}
$('#go').onclick = async () => { $('#sErr').textContent = ''; const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value }); if (error) $('#sErr').textContent = error.message; else show(); };
$('#open').onclick = openCode; $('#code').addEventListener('keydown', (e) => { if (e.key === 'Enter') openCode(); });
$('#out').onclick = async () => { await sb.auth.signOut(); show(); };
const q = new URLSearchParams(location.search).get('code'); if (q) $('#code').value = q;
show().then(() => { if (q && !$('#app').hidden) openCode(); });
</script>
</body>
</html>
