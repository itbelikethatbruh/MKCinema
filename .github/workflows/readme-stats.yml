name: README stats

# Draws the README's live images and publishes them to the readme-assets
# branch, so main never gets bot commits:
# - stats.svg: latest release, app downloads and commits from the GitHub API
# - marquee.svg: "Now showing", the most-voted approved nomination
#   (issues labelled marquee + approved) or a daily classic
on:
  schedule:
    - cron: "17 5 * * *"
  release:
    types: [published]
  issues:
    types: [labeled, unlabeled, closed, reopened]
  push:
    branches: [main]
    paths: [".github/readme/**", ".github/workflows/readme-stats.yml"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: readme-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts and tools
        working-directory: .github/readme
        run: |
          pip install --quiet fonttools brotli pillow
          npm pack --silent @fontsource/fraunces@5 @fontsource/space-grotesk@5
          for f in *.tgz; do mkdir -p "${f%.tgz}" && tar xzf "$f" -C "${f%.tgz}" --strip-components 1; done
      - name: Labels for marquee nominations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create marquee --color d9d4c7 --description "Film nominated for the README marquee" 2>/dev/null || true
          gh label create approved --color 9ccfb0 --description "Approved by the maintainer" 2>/dev/null || true
      - name: Draw the images
        working-directory: .github/readme
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 stats.py "$RUNNER_TEMP/out/stats.svg"
          python3 marquee.py "$RUNNER_TEMP/out/marquee.svg"
      - name: Publish to readme-assets
        working-directory: ${{ runner.temp }}/out
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b readme-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg marquee.svg
          git commit -q -m "README stats $(date -u +%F)"
          git push -fq "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" readme-assets
