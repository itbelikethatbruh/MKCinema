name: Docker image

on:
  push:
    branches: [main]
    paths: [app/**, Dockerfile, .dockerignore, .github/workflows/docker.yml]
    tags: ['v*']
  pull_request:
    paths: [app/**, Dockerfile, .dockerignore, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mkcinema
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker build -t mkc-test .
          docker run -d --name mkc -p 7000:7000 mkc-test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:7000/manifest.webmanifest >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:7000/ | grep -q '<title>'
