name: Live app journeys

# Every day, walks every main journey (tools/journey-check.mjs) through the live web app, app.mkcinema.app, on a slow
# phone, a computer and a Fire TV remote, so a problem that slipped through shows up here before anyone reports it.
# A failing run keeps the frames of each failing step as an artifact. The live catalog is used; the films come from
# the script's own test addon, so nothing is played from anyone's sources.
on:
  schedule:
    - cron: '17 9 * * *'   # 4:17 AM Eastern (winter), 5:17 AM in summer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chromium and ffmpeg
        run: |
          command -v ffmpeg > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg > /dev/null; }
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund --silent playwright@1.63.0
          for attempt in 1 2 3; do
            "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium && exit 0
            sleep 30
          done
          exit 1
      - name: Journeys on the live app
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/journey-check.mjs https://app.mkcinema.app --out="$RUNNER_TEMP/journeys" --json="$RUNNER_TEMP/journeys/results.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-journeys
          path: |
            ${{ runner.temp }}/journeys/frames/*.jpg
            ${{ runner.temp }}/journeys/results.json
          retention-days: 14
          if-no-files-found: ignore
