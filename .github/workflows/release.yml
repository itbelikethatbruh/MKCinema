name: Release

# Publishes a GitHub release with the app files from site/download and the notes in
# .github/release/<tag>.md. Run it from Actions › Release › Run workflow, or push a tag like v1.0.
# A change to site/download on main also publishes a release (tag files-<date>-<commit>), so the checksums on
# GitHub always cover the files the website serves.
#
# every release also gets
# - SHA256SUMS, a list of the SHA-256 of every file, attached to the release and printed in the notes
# - a build provenance attestation for every file (check with: gh attestation verify <file> -R <owner>/<repo>)
# How users check a download is in SECURITY.md ("Verifying downloads").
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.0
        required: true
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["site/download/**"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation (Sigstore, keyless)
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checksums and notes
        env:
          TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          [ -n "$TAG" ] || TAG="files-$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          (cd site/download && [ ! -f SHA256SUMS ] || sha256sum -c --quiet SHA256SUMS) || { echo "::error::site/download/SHA256SUMS is out of date"; exit 1; }
          [[ "$TAG" =~ ^(v|files-)[0-9A-Za-z._-]+$ ]] || { echo "::error::Unexpected tag: $TAG"; exit 1; }
          (cd site/download && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum) > "$RUNNER_TEMP/SHA256SUMS"
          # the files that go out: everything in site/download except the site's own copy of SHA256SUMS
          mkdir "$RUNNER_TEMP/out" && find site/download -maxdepth 1 -type f ! -name SHA256SUMS -exec cp {} "$RUNNER_TEMP/out/" \; && cp "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/out/"
          cat "$RUNNER_TEMP/SHA256SUMS"
          notes=".github/release/${TAG}.md"
          {
            [ -f "$notes" ] && cat "$notes"
            echo
            echo "### Checksums (SHA-256)"
            echo
            echo "Check that a download is the real file before you install it. The same list is attached as \`SHA256SUMS\`."
            echo
            echo '```'
            cat "$RUNNER_TEMP/SHA256SUMS"
            echo '```'
            echo
            echo "How to check: https://github.com/${GITHUB_REPOSITORY}/blob/main/SECURITY.md#verifying-downloads"
          } > "$RUNNER_TEMP/notes.md"
      - name: Provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/out/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MKCinema ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/out/*
