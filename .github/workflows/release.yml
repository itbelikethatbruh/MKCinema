name: Release

# Builds every app from source and publishes them as a GitHub release when a version tag is pushed:
#
#   git tag v2.0 && git push origin v2.0      (or Actions › Release › Run workflow, with a tag)
#
# What a tag release carries (each app keeps its own version, read from its source by tools/release/versions.py):
#   MKCinema.apk, MKCinema-TV.apk     Android, Android TV, Google TV, Fire TV (one APK, signed with the release key)
#   MKCinema.exe                      Windows 10 and 11, 64-bit
#   MKCinema-<v>-mac.zip, .dmg        macOS 11+, Apple silicon and Intel (not notarized, see docs/releases.md)
#   mkcinema_<v>_amd64.deb, mkcinema-<v>-linux-x86_64.tar.gz   Linux x86-64
#   com.mkcinema.app_<v>_all.ipk      LG webOS (beta), copied from the website (no webOS build in CI yet)
#   release.json                      the machine-readable list of all of the above, for updaters
#   SHA256SUMS                        the SHA-256 of every file, also printed in the notes
# Every file also gets a build provenance attestation (check with: gh attestation verify <file> -R <owner>/<repo>).
#
# The release title names the Android version ("MKCinema 2.0 · Android 1.9.1"). Updaters follow that: the newest
# tag release is always https://github.com/<repo>/releases/latest/download/release.json. Details: docs/releases.md.
#
# Android signing needs ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASS (see android-apk.yml). Without them the release
# carries the APK the website serves instead, checked against site/download/SHA256SUMS, and says so in the run log.
#
# A change to site/download/SHA256SUMS on main still publishes a "files" release (tag files-<date>-<commit>) with the
# exact files the website serves, so the checksums on GitHub cover them. Those releases are never marked latest and
# have no Android version in the title, so updaters skip them.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["site/download/SHA256SUMS"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (like v2.0)
        required: true
      build:
        description: Build the apps from source (off copies the website's files)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || '' }}
  cancel-in-progress: false

env:
  SITE: https://mkcinema.app/download
  # the files a "files" release copies from the website (update the versioned names when those builds change)
  SITE_FILES: >-
    MKCinema.apk
    MKCinema.exe
    MKCinema-1.1.1-mac.zip
    mkcinema_1.1_amd64.deb
    mkcinema-1.1-linux-x86_64.tar.gz
    com.mkcinema.app_1.1.0_all.ipk
  WEBOS_FILE: com.mkcinema.app_1.1.0_all.ipk

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      build: ${{ steps.p.outputs.build }}
      versions: ${{ steps.p.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: p
        name: Tag, mode and app versions
        env:
          IN_TAG: ${{ inputs.tag }}
          IN_BUILD: ${{ inputs.build }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then tag=$IN_TAG; build=$IN_BUILD
          elif [ "$REF_TYPE" = tag ]; then tag=$REF_NAME; build=true
          else tag="files-$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"; build=false
          fi
          [[ "$tag" =~ ^(v[0-9][0-9A-Za-z._-]*|files-[0-9A-Za-z._-]+)$ ]] || { echo "::error::Unexpected tag: $tag"; exit 1; }
          if [ "$build" = true ] && [[ "$tag" != v* ]]; then echo "::error::Builds need a v tag, got $tag"; exit 1; fi
          python3 -I tools/release/versions.py > versions.json
          cat versions.json
          { echo "tag=$tag"; echo "build=$build"; echo "versions=$(jq -c . versions.json)"; } >> "$GITHUB_OUTPUT"
          echo "### $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "Build from source: $build" >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: read
    outputs:
      built: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Signing key present?
        id: gate
        env:
          HAS_KS: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASS != '' }}
        run: |
          if [ "$HAS_KS" != "true" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASS are not both set: this release carries the website's APK instead of a new build."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.ok == 'true'
        with:
          persist-credentials: false
      - name: Android SDK parts
        if: steps.gate.outputs.ok == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null
      - name: Build and sign
        if: steps.gate.outputs.ok == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          umask 077
          ks="$RUNNER_TEMP/keystore"
          trap 'rm -rf "$ks"' EXIT
          mkdir -p "$ks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks/mkcinema.jks"
          printf '%s\n' "$ANDROID_KEYSTORE_PASS" > "$ks/password.txt"
          unset ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASS
          KS="$ks/mkcinema.jks" KS_PASS="file:$ks/password.txt" SDK="$ANDROID_HOME" OUT="$RUNNER_TEMP/apk" sh android/build.sh
      - name: Check the signature is the release key
        if: steps.gate.outputs.ok == 'true'
        run: |
          # the same certificate SECURITY.md publishes; any other key would make Android refuse the update
          want=9fb8084d9a612d3a3b804921a292959fd2feddf19b8cdf81c0ace824b1cf7fd9
          got=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/apk/MKCinema.apk" | awk '/Signer #1 certificate SHA-256 digest/ {print $NF}')
          [ "$got" = "$want" ] || { echo "::error::APK signed with $got, expected the release key $want"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out" && cp "$RUNNER_TEMP/apk/MKCinema.apk" "$RUNNER_TEMP/out/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.ok == 'true'
        with:
          name: app-android
          path: ${{ runner.temp }}/out/
          retention-days: 3
          if-no-files-found: error

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum
      - name: Test and build MKCinema.exe
        working-directory: windows
        run: |
          go vet ./...
          go test ./...
          go install github.com/akavel/rsrc@v0.10.2
          "$(go env GOPATH)/bin/rsrc" -arch amd64 -ico mkcinema.ico -manifest app.manifest -o rsrc_windows_amd64.syso
          mkdir -p "$RUNNER_TEMP/out"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o "$RUNNER_TEMP/out/MKCinema.exe" .
          file "$RUNNER_TEMP/out/MKCinema.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-windows
          path: ${{ runner.temp }}/out/
          retention-days: 3
          if-no-files-found: error

  linux:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # the oldest supported runner, so the binary runs on older glibc (Ubuntu 22.04, Debian 12 and newer)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum
      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev python3-pil
          pkg-config --modversion webkit2gtk-4.1
      - name: Build .deb and .tar.gz
        run: |
          OUT="$RUNNER_TEMP/build" sh linux/package.sh
          mkdir -p "$RUNNER_TEMP/out" && cp "$RUNNER_TEMP"/build/*.deb "$RUNNER_TEMP"/build/*.tar.gz "$RUNNER_TEMP/out/"
          dpkg-deb --info "$RUNNER_TEMP"/out/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-linux
          path: ${{ runner.temp }}/out/
          retention-days: 3
          if-no-files-found: error

  macos:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum
      - name: Build the zip and the disk image
        env:
          VERSIONS: ${{ needs.plan.outputs.versions }}
        run: |
          V=$(jq -r .macos.version <<< "$VERSIONS")
          OUT="$RUNNER_TEMP/build" sh mac/package.sh
          # the disk image: the app plus an Applications shortcut to drag it onto
          ln -s /Applications "$RUNNER_TEMP/build/stage/Applications"
          hdiutil create -volname MKCinema -srcfolder "$RUNNER_TEMP/build/stage" -fs HFS+ -format UDZO -ov "$RUNNER_TEMP/build/MKCinema-$V.dmg"
          hdiutil verify "$RUNNER_TEMP/build/MKCinema-$V.dmg"
          mkdir -p "$RUNNER_TEMP/out" && cp "$RUNNER_TEMP/build/MKCinema-$V-mac.zip" "$RUNNER_TEMP/build/MKCinema-$V.dmg" "$RUNNER_TEMP/out/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-macos
          path: ${{ runner.temp }}/out/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [plan, android, windows, linux, macos]
    # runs for "files" releases (the build jobs are skipped) and after every build job succeeded
    if: >-
      always() && needs.plan.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation (Sigstore, keyless)
      attestations: write  # store the attestation
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      BUILD: ${{ needs.plan.outputs.build }}
      ANDROID_BUILT: ${{ needs.android.outputs.built }}
      VERSIONS: ${{ needs.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.build == 'true'
        with:
          pattern: app-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Files from the website
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          if [ "$BUILD" = true ]; then
            want="$WEBOS_FILE"
            [ "$ANDROID_BUILT" = true ] || want="$want MKCinema.apk"
          else
            want="$SITE_FILES"
          fi
          for f in $want; do
            type=$(curl -fsSL --retry 3 -o "$RUNNER_TEMP/dist/$f" -w '%{content_type}' "$SITE/$f")
            size=$(stat -c %s "$RUNNER_TEMP/dist/$f")
            # Unknown paths on the site return the home page, so reject HTML and tiny files.
            if [[ "$type" == text/html* || "$size" -lt 100000 ]]; then
              echo "::error::$f is missing on the website ($type, $size bytes)"; exit 1
            fi
            # the file must be the one the website's SHA256SUMS lists
            listed=$(awk -v f="$f" '$2 == f {print $1}' site/download/SHA256SUMS)
            got=$(sha256sum "$RUNNER_TEMP/dist/$f" | cut -d' ' -f1)
            if [ -z "$listed" ] || [ "$listed" != "$got" ]; then
              echo "::error::$f does not match site/download/SHA256SUMS (listed ${listed:-nothing}, got $got)"; exit 1
            fi
            echo "$f from the website, $size bytes"
          done
          cp "$RUNNER_TEMP/dist/MKCinema.apk" "$RUNNER_TEMP/dist/MKCinema-TV.apk"
          ls -la "$RUNNER_TEMP/dist"
      - name: Versions, title and release.json
        run: |
          built=""
          if [ "$BUILD" = true ]; then
            built="windows,linux,macos"; [ "$ANDROID_BUILT" = true ] && built="android,$built"
            printf '%s' "$VERSIONS" > "$RUNNER_TEMP/versions.json"
          else
            echo '{}' > "$RUNNER_TEMP/versions.json"
          fi
          # an APK copied from the website is the version the website's version.json offers
          if [ "$ANDROID_BUILT" != true ]; then
            site_android=$(jq -r '.android // empty' app/version.json)
            jq --arg v "$site_android" 'if $v == "" then del(.android) else .android = {version: $v} end' \
              "$RUNNER_TEMP/versions.json" > "$RUNNER_TEMP/v2.json" && mv "$RUNNER_TEMP/v2.json" "$RUNNER_TEMP/versions.json"
          fi
          android=$(jq -r '.android.version // empty' "$RUNNER_TEMP/versions.json")
          if [ "$BUILD" = true ]; then
            [ -n "$android" ] || { echo "::error::No Android version for the release title"; exit 1; }
            title="MKCinema ${TAG#v} · Android $android"
          else
            title="MKCinema website files ${TAG#files-}"
          fi
          echo "TITLE=$title" >> "$GITHUB_ENV"
          python3 -I tools/release/manifest.py --dist "$RUNNER_TEMP/dist" --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --versions "$RUNNER_TEMP/versions.json" --built "$built" --title "$title" > "$RUNNER_TEMP/dist/release.json"
          jq . "$RUNNER_TEMP/dist/release.json"
      - name: Checksums and notes
        run: |
          (cd "$RUNNER_TEMP/dist" && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum) > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          notes=".github/release/${TAG}.md"
          m="$RUNNER_TEMP/dist/release.json"
          {
            if [ -f "$notes" ]; then cat "$notes"
            else
              echo "## $TITLE"
              echo
              echo "| Platform | File | Version | Requirements |"
              echo "|---|---|---|---|"
              jq -r '.platforms | to_entries[] | . as $p | .value.files[] | "| \($p.key) | `\(.name)` | \($p.value.version // "") | \($p.value.needs) |"' "$m"
            fi
            echo
            if [ "$BUILD" = true ]; then
              echo "Built from source by the release workflow from commit \`${GITHUB_SHA::7}\`."
              [ "$ANDROID_BUILT" = true ] || echo "The APK is the one mkcinema.app serves (checked against its SHA256SUMS)."
              echo
              echo "The Windows exe isn't code-signed, so the first run shows \"Windows protected your PC\": choose **More info**, then **Run anyway**. The Mac app isn't notarized: open it once, then go to **System Settings › Privacy & Security › Open Anyway**."
              echo
              echo "**Automatic Android updates:** add MKCinema to Obtainium from [mkcinema.app](https://mkcinema.app/#download), or follow \`release.json\` on this page. The app also offers updates by itself."
            else
              echo "The exact files mkcinema.app serves today, so the checksums below cover every download on the website."
            fi
            echo
            echo "### Checksums (SHA-256)"
            echo
            echo "Check that a download is the real file before you install it. The same list is attached as \`SHA256SUMS\`."
            echo
            echo '```'
            cat "$RUNNER_TEMP/SHA256SUMS"
            echo '```'
            echo
            echo "How to check: https://github.com/${GITHUB_REPOSITORY}/blob/main/SECURITY.md#verifying-downloads"
          } > "$RUNNER_TEMP/notes.md"
      - name: Provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*
            ${{ runner.temp }}/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=true; [ "$BUILD" = true ] || latest=false
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --latest="$latest" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/dist/* "$RUNNER_TEMP/SHA256SUMS"
          echo "Published $TAG: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
