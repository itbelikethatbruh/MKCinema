name: Release

# Publishes a GitHub release with the app files the website serves today and the notes in
# .github/release/<tag>.md. Run it from Actions › Release › Run workflow, or push a tag like v1.0.
#
# The files are not kept in git. They are downloaded from https://mkcinema.app/download/, so a
# release always carries exactly what the website hands out. FILES is the full list: update the
# versioned names (Mac, Linux, webOS) when a new build goes up. The TV app is the phone APK.
#
# every release also gets
# - SHA256SUMS, a list of the SHA-256 of every file, attached to the release and printed in the notes
# - a build provenance attestation for every file (check with: gh attestation verify <file> -R <owner>/<repo>)
# How users check a download is in SECURITY.md ("Verifying downloads").
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.0
        required: true
  push:
    tags: ["v*"]

permissions: {}

env:
  SITE: https://mkcinema.app/download
  FILES: >-
    MKCinema.apk
    MKCinema.exe
    MKCinema-1.1.1-mac.zip
    mkcinema_1.1_amd64.deb
    mkcinema-1.1-linux-x86_64.tar.gz
    com.mkcinema.app_1.1.0_all.ipk

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation (Sigstore, keyless)
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the app files from the website
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          for f in $FILES; do
            type=$(curl -fsSL --retry 3 -o "$RUNNER_TEMP/dist/$f" -w '%{content_type}' "$SITE/$f")
            size=$(stat -c %s "$RUNNER_TEMP/dist/$f")
            # Unknown paths on the site return the home page, so reject HTML and tiny files.
            if [[ "$type" == text/html* || "$size" -lt 100000 ]]; then
              echo "::error::$f is missing on the website ($type, $size bytes)"; exit 1
            fi
            echo "$f  $size bytes  $type"
          done
          cp "$RUNNER_TEMP/dist/MKCinema.apk" "$RUNNER_TEMP/dist/MKCinema-TV.apk"
      - name: Checksums and notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "::error::Unexpected tag: $TAG"; exit 1; }
          (cd "$RUNNER_TEMP/dist" && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum) > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          notes=".github/release/${TAG}.md"
          {
            [ -f "$notes" ] && cat "$notes"
            echo
            echo "### Checksums (SHA-256)"
            echo
            echo "Check that a download is the real file before you install it. The same list is attached as \`SHA256SUMS\`."
            echo
            echo '```'
            cat "$RUNNER_TEMP/SHA256SUMS"
            echo '```'
            echo
            echo "How to check: https://github.com/${GITHUB_REPOSITORY}/blob/main/SECURITY.md#verifying-downloads"
          } > "$RUNNER_TEMP/notes.md"
      - name: Provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*
            ${{ runner.temp }}/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MKCinema ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/dist/* "$RUNNER_TEMP/SHA256SUMS"
