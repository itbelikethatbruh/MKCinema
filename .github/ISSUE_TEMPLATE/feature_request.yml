name: Feature request
description: Suggest an idea for MKCinema
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the moment where MKCinema falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Mockups and examples are welcome.
  - type: checkboxes
    id: rules
    attributes:
      label: Ground rules
      options:
        - label: This doesn't add built-in content, tracking, or anyone's shared keys (see CONTRIBUTING.md).
          required: true
