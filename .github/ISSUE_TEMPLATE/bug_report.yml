name: Bug report
description: Something in MKCinema doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! First send a log from the app: **Settings › Help › Send log**. It gives you a 6-character code that lets us see what went wrong on your device. Logs never include debrid keys, passwords, addon links or stream links, and you should not paste any of those here either.
  - type: input
    id: log_code
    attributes:
      label: Log code
      description: The 6-character code from Settings › Help › Send log. Type "none" if you can't send one.
      placeholder: e.g. K7QM2X
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MKCinema version
      description: Shown in Settings › About.
      placeholder: e.g. 2.46.4
  - type: dropdown
    id: platform
    attributes:
      label: Where does it happen?
      multiple: true
      options: [Web (browser), Android app, Android TV or Fire TV app, LG webOS app, Windows app, Mac app, Linux app, Website]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser or OS version
      placeholder: e.g. Pixel 8, Android 15, Chrome 130, or Fire TV Stick 4K Max
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
