# Weekly update pull requests for pinned GitHub Actions and the code dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /tools/legacy-tv
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /windows
    schedule: { interval: weekly }
