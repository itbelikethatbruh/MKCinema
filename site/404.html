<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · MKCinema</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<style>
@font-face{font-family:"Fraunces";font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/fraunces-v1.woff2) format("woff2")}
@font-face{font-family:"Fraunces";font-style:italic;font-weight:400 600;font-display:swap;src:url(/fonts/fraunces-italic-v1.woff2) format("woff2")}
@font-face{font-family:"Onest";font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/onest-v1.woff2) format("woff2")}
:root{--bg:#050505;--ink:#f3f0e9;--ink2:#c9c5bc;--line2:rgba(255,255,255,.14);--gold:#d8c29a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;-webkit-font-smoothing:antialiased;
  background-image:conic-gradient(from 180deg at 50% 0%,transparent 162deg,rgba(255,236,205,.06) 172deg,rgba(255,240,215,.11) 180deg,rgba(255,236,205,.06) 188deg,transparent 198deg)}
main{max-width:34rem}
.code{font:600 11.5px/1 "Onest",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
h1{margin:18px 0 0;font:400 clamp(40px,8vw,72px)/1 "Fraunces",Georgia,serif;letter-spacing:-.02em;font-variation-settings:"opsz" 96}
h1 em{color:var(--gold)}
p{margin:20px auto 0;color:var(--ink2);max-width:42ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
a.btn{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:999px;font:600 15px/1 "Onest",sans-serif;text-decoration:none;color:var(--ink);border:1px solid var(--line2)}
a.btn.plat{color:#0a0a0a;border:0;background:linear-gradient(180deg,#fbf9f4,#d9d5cc)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="code">404 · Wrong screen</span>
  <h1>This reel <em>isn't showing.</em></h1>
  <p>The page you were looking for doesn't exist or has moved. The film is still on in the main room.</p>
  <div class="cta">
    <a class="btn plat" href="/">Back to MKCinema</a>
    <a class="btn" href="https://app.mkcinema.app/">Open the app</a>
  </div>
</main>
</body>
</html>
